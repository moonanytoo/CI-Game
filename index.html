<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>CI Challenge Game Show</title><style>body{margin:0;font-family:Segoe UI,sans-serif;background:linear-gradient(135deg,#0F172A,#1E3A8A,#0EA5E9);color:#fff}.container{max-width:1100px;margin:auto;padding:20px}.hero img{width:100%;max-width:650px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.2)}.card{background:#fff;color:#111827;border-radius:24px;padding:35px;box-shadow:0 15px 35px rgba(0,0,0,.12)}.primary{width:100%;padding:16px;border:none;border-radius:14px;background:linear-gradient(135deg,#FF8F1F,#FFB84A);color:#fff;font-weight:bold;font-size:18px}.secondary{width:100%;padding:24px;border:none;border-radius:18px;background:#E5E7EB;color:#111827;font-size:28px;font-weight:600;margin-top:18px;cursor:pointer}.secondary:hover{background:#00A3E0;color:#fff}.progress{height:12px;background:#EAF2FF;border-radius:20px;overflow:hidden}.bar{height:12px;background:linear-gradient(90deg,#00A3E0,#00D084)}.timer{text-align:center;color:#E11D48;font-size:60px;font-weight:bold;margin:20px 0;animation:pulse 1s infinite}.hero{text-align:center}.score{font-size:28px;font-weight:bold;color:#00A3E0}@keyframes pulse{50%{transform:scale(1.08)}}</style></head><body><div class="container" id="app"></div><script>const FLOW_URL='https://default424992fe6af1421590b3fc5eb9c227.b3.environment.api.powerplatform.com/powerautomate/automations/direct/cu/20/workflows/ee283027fe704637bce41e8ed06ec781/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=hs_9P2KreWoZCpXGJb-APZw7FBgw3NAFZMcr0eCdzV8';const audioStart=new Audio('https://actions.google.com/sounds/v1/cartoon/concussive_drum_hit.ogg');const audioCorrect=new Audio('https://actions.google.com/sounds/v1/cartoon/magic_chime.ogg');const audioWrong=new Audio('https://actions.google.com/sounds/v1/alarms/digital_watch_alarm_long.ogg');const audioTick=new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');const audioClap=new Audio('https://actions.google.com/sounds/v1/crowds/applause.ogg');const q=[['ขั้นตอนไหนเป็น Waste?',['ลูกค้าส่ง Email มาที่บริษัท','พนักงาน Print เอกสารแล้ว Scan กลับเข้าไปเก็บในระบบ','การรับเรื่อง','การอนุมัติ'],1],['Prompt ไหนดีที่สุด?',['สรุปให้หน่อย','ช่วยดูหน่อย','You are a business analyst. Summarize root cause and actions.','OK'],2],['งานใดเหมาะกับ Automation มากที่สุด?',['สร้างความสัมพันธ์ลูกค้า','ส่ง Report ทุกวัน','Strategic Decision','Coaching'],1],['การปรับปรุง process ควรเริ่มจากอะไร?',['ซื้อ AI','ซื้อ RPA','เพิ่มคน','เข้าใจกระบวนการก่อน'],3],['แนวคิดที่ถูกต้องคือ?',['Lean → AI → Automation','Automation ก่อน','ซื้อ Technology ก่อน','จ้างคนเพิ่ม'],0]];let p='',c=0,s=0,t=15,st=0,bst=0,tm;function badge(x){if(x>=150)return'👑 CI Grand Master';if(x>=120)return'🏆 CI Champion';if(x>=90)return'⚡ Automation Builder';if(x>=60)return'🤖 AI Explorer';return'🏭 Lean Explorer';}function home(){app.innerHTML=`<div class='hero'><img src='LEANAI.png'><h1>🎮 Escape The Manual Work</h1></div><div class='card'><h2>📋 วิธีการเล่น</h2><p>✅ ตอบ 5 ข้อ เกี่ยวกับ LEAN, AI และ Automation</p><p>⏱ 15 วินาทีต่อข้อ</p><p>🎯 ตอบถูก = 20 คะแนน + เวลาที่เหลือ</p><p>❌ ตอบผิด = 0 คะแนน</p><p>🏆 Grand Master 150+ คะแนน</p><input id='n' placeholder='ชื่อผู้เล่น'><button class='primary' onclick='start()'>🚀 Start Mission</button></div>`}function start(){audioStart.play();p=document.getElementById('n').value||'Anonymous';c=0;s=0;st=0;bst=0;setTimeout(show,500)}function show(){clearInterval(tm);t=15;let x=q[c];app.innerHTML=`<div class='card'><div class='progress'><div class='bar' style='width:${((c+1)/q.length)*100}%'></div></div><h1 style='font-size:52px;color:#003B8E'>ข้อ ${c+1}</h1><h2 style='font-size:34px'>${x[0]}</h2><div>Player: <b>${p}</b></div><div class='score'>🏆 Score : ${s}</div><div class='timer'>⏱ ${t}</div>${x[1].map((a,i)=>`<button class='secondary' onclick='ans(${i})'>${a}</button>`).join('')}</div>`;tm=setInterval(()=>{t--;if(t<=5&&t>0){audioTick.currentTime=0;audioTick.play()}document.querySelector('.timer').innerHTML='⏱ '+t;if(t<=0){clearInterval(tm);next(false)}},1000)}function ans(i){document.querySelectorAll('.secondary').forEach(b=>b.disabled=true);let ok=i===q[c][2];(ok?audioCorrect:audioWrong).play();setTimeout(()=>next(ok),700)}function next(ok){if(ok){st++;bst=Math.max(bst,st);s+=20+t}else st=0;c++;c>=q.length?finish():show()}async function submit(){try{let r=await fetch(FLOW_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({playerName:p,score:s,badge:badge(s)})});return r.ok}catch(e){return false}}async function finish(){audioClap.play();let saved=await submit();app.innerHTML=`<div class='card'><h1>🏆 MISSION COMPLETE</h1><h2>${badge(s)}</h2><h3>Score ${s}</h3><p>🔥 Best Streak ${bst}</p><p>${saved?'✅ Score Submitted Successfully':'❌ Save Failed'}</p><button class='primary' onclick='home()'>🔄 Play Again</button></div>`}home();</script></body></html>
