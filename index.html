<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CI Challenge Auto Submit</title><style>body{margin:0;font-family:Segoe UI,sans-serif;background:linear-gradient(135deg,#003B7A,#00A3E0);color:white}.container{max-width:900px;margin:auto;padding:30px}.card{background:white;color:#222;padding:25px;border-radius:20px}button{width:100%;margin:8px 0;padding:14px;border:none;border-radius:12px;cursor:pointer;font-size:16px}.primary{background:#00A3E0;color:white}.secondary{background:#E5E7EB}.progress{background:#ddd;height:15px;border-radius:20px}.bar{background:#00E5FF;height:15px;border-radius:20px}input{width:100%;padding:12px;border-radius:10px;border:none}.badge{font-size:30px;font-weight:bold}</style></head><body><div class="container" id="app"></div><script>const FLOW_URL='https://default424992fe6af1421590b3fc5eb9c227.b3.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/20/workflows/ee283027fe704637bce41e8ed06ec781/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=hs_9P2KreWoZCpXGJb-APZw7FBgw3NAFZMcr0eCdzV8';const questions=[{q:'ขั้นตอนไหนเป็น Waste?',o:['ลูกค้าส่ง Email','Print แล้ว Scan กลับเข้าเครื่อง','รับเรื่อง','อนุมัติ'],a:1},{q:'Prompt ไหนดีที่สุด?',o:['สรุปให้หน่อย','ช่วยดูหน่อย','You are a business analyst. Summarize root cause and actions.','OK'],a:2},{q:'งานใดเหมาะกับ Automation มากที่สุด?',o:['สร้างความสัมพันธ์ลูกค้า','ส่ง Report ทุกวัน','Strategic Decision','Coaching'],a:1},{q:'ควรเริ่มจากอะไร?',o:['ซื้อ AI','ซื้อ RPA','เพิ่มคน','เข้าใจกระบวนการก่อน'],a:3},{q:'แนวคิดที่ถูกต้องคือ?',o:['Lean → AI → Automation','Automation ก่อน','ซื้อ Technology ก่อน','จ้างคนเพิ่ม'],a:0}];let playerName='',current=0,score=0,bestStreak=0,streak=0,timeLeft=15,timer;function getBadge(s){if(s>=150)return '👑 CI Grand Master';if(s>=120)return '🏆 CI Champion';if(s>=90)return '⚡ Automation Builder';if(s>=60)return '🤖 AI Explorer';return '🏭 Lean Explorer';}function home(){app.innerHTML=`<h1>🎮 Escape The Manual Work</h1><div class='card'><input id='playerName' placeholder='ชื่อผู้เล่น'><button class='primary' onclick='startGame()'>▶ Start Mission</button></div>`;}function startGame(){playerName=document.getElementById('playerName').value||'Anonymous';current=0;score=0;streak=0;bestStreak=0;showQ();}function showQ(){clearInterval(timer);timeLeft=15;let q=questions[current];app.innerHTML=`<div class='card'><h2>ข้อ ${current+1}</h2><h3>${q.q}</h3>${q.o.map((x,i)=>`<button class='secondary' onclick='answer(${i})'>${x}</button>`).join('')}<p>⏱ <span id=t>${timeLeft}</span></p></div>`;timer=setInterval(()=>{timeLeft--;let e=document.getElementById('t');if(e)e.textContent=timeLeft;if(timeLeft<=0){clearInterval(timer);next(false)}},1000)}function answer(i){next(i===questions[current].a)}function next(ok){if(ok){streak++;bestStreak=Math.max(bestStreak,streak);score+=20+timeLeft}else streak=0;current++;current>=questions.length?finishGame():showQ()}async function submitResult(){try{const r=await fetch(FLOW_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({playerName:playerName,score:score,badge:getBadge(score)})});return r.ok}catch(e){return false}}async function finishGame(){const saved=await submitResult();app.innerHTML=`<div class='card'><h1>🎉 Mission Complete</h1><div class='badge'>${getBadge(score)}</div><h2>Score: ${score}</h2><p>🔥 Best Streak: ${bestStreak}</p><p style='font-weight:bold;color:${saved?'green':'red'}'>${saved?'✅ Score Submitted Successfully':'❌ Score Submit Failed'}</p><button class='secondary' onclick='home()'>🔄 Play Again</button></div>`;}home();</script></body></html>
